[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keymap-atlas"
version = "0.1.1"
description = "键位图鉴：把 Linux 上散落在各层的快捷键整理成中文速查表，并用真实键盘与 HID 描述符校验能不能按出来"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ayeez", email = "231453001+Ayeez757@users.noreply.github.com" }]
keywords = ["shortcut", "keymap", "niri", "wayland", "hid", "input-devices", "linux", "i18n"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Chinese (Simplified)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Environment",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
probe = ["PyGObject>=3.42"]      # 只有 probe（GTK4 按键探针）需要

[project.urls]
Homepage = "https://keymap.ayeez.cn/"
Repository = "https://github.com/Ayeez757/keymap-atlas"
"Bug Tracker" = "https://github.com/Ayeez757/keymap-atlas/issues"

[project.scripts]
keymap-atlas = "keymap_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keymap_atlas = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]                # 中文表格行本来就很长
