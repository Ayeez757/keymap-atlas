# 静态站配置：只做文件服务 + 少量安全头。
#
# 为什么这里要自己终结 TLS：natfrp 的 https 隧道在 node 59 上是**原样转发**
# TLS 字节的（实测：把 ClientHello 发到 443，最终在 nginx 日志里出现裸的
# "\x16\x03\x01..." 并回 400）。也就是说 TLS 必须由隧道目标端自己结束。
# 因此 nginx 监听 443 并用 deploy/certs/keymap.ayeez.cn.crt 提供 TLS；
# 换成正式证书时只需替换这两个文件再重启容器，配置不用改。

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name keymap.ayeez.cn keymap.ayeez.cn:80 localhost;

    ssl_certificate     /etc/nginx/certs/keymap.ayeez.cn.crt;
    ssl_certificate_key /etc/nginx/certs/keymap.ayeez.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 关掉版本号，减少指纹信息
    server_tokens off;

    # gzip：HTML 里有大段中文，压缩收益明显（约 1/3）
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # 安全头。这里**故意不设 CSP**：站点通过 overlay 注入第三方脚本，
    # 一条写不好的 CSP 会让它静默失效且难以排查。真要加，先在前端用浏览器
    # 控制台确认所需域，再按 report-only 试跑。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 本地扩展点：/etc/nginx/overlay/ 里若有 *.conf 会被并进来（容器里默认不存在）。
    # 用来放不适合进仓库的站点级附加配置；通配符为空时 nginx 不会报错。
    include /etc/nginx/overlay/*.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源缓存：CSS/JS 一天，图片一周。文件名不带 hash，所以别设太长。
    location ~* \.(css|js)$ {
        expires 1d;
    }
    location ~* \.(png|jpg|jpeg|webp|svg|ico)$ {
        expires 7d;
    }

    # 视频：文件名不带 hash，缓存一天就够，换素材时不用等一周。
    # Accept-Ranges 由 nginx 对静态文件自动给出，这里只声明类型即可。
    location ~* \.(mp4|webm)$ {
        expires 1d;
        types { video/mp4 mp4; video/webm webm; }
        default_type video/mp4;
    }

    # 不暴露隐藏文件
    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
