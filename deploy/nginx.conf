# 静态站配置：只做文件服务 + 少量安全头。
# 证书由 natfrp 的 HTTPS 隧道终结（frpc 读端口目录里的 keymap.ayeez.cn.crt/.key），
# 所以这里只监听 80，不要自己再套一层 TLS。

server {
    listen 80;
    server_name keymap.ayeez.cn keymap.ayeez.cn:80 localhost;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 关掉版本号，减少指纹信息
    server_tokens off;

    # gzip：HTML 里有大段中文，压缩收益明显（约 1/3）
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # 安全头。这里**故意不设 CSP**：AdSense 会往页面注入内联脚本，Adsterra 的
    # invoke.js 还会再开 iframe；一条写不好的 CSP 会让广告静默失效且难以排查。
    # 真要加，先在前端用浏览器控制台确认所需域，再按 report-only 试跑。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源缓存：CSS/JS 一天，图片一周。文件名不带 hash，所以别设太长。
    location ~* \.(css|js)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
    location ~* \.(png|jpg|jpeg|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 不暴露隐藏文件
    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
