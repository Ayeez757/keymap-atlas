# 纯静态站点：nginx 直接吐文件，不起任何后端。
# natfrp 的 keymap 隧道把 TLS 字节原样送到宿主机 127.0.0.1:8080，
# 由容器内 nginx 终结 TLS（证书在 ./certs）。
services:
  web:
    image: nginx:1.27-alpine
    container_name: keymap-atlas-web
    restart: always
    ports:
      # 8080 是 natfrp keymap 隧道指向的端口，TLS 在容器内的 nginx 终结
      - "127.0.0.1:8080:443"
      # 8081 保留明文 HTTP，本机调试用
      - "127.0.0.1:8081:80"
    volumes:
      - ../web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
