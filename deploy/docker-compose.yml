# 纯静态站点：nginx 直接吐文件，不起任何后端。
# natfrp 的 keymap 隧道反代到宿主机 127.0.0.1:8080，所以这边只绑 8080。
services:
  web:
    image: nginx:1.27-alpine
    container_name: keymap-atlas-web
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ../web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
